services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ortxcore
      POSTGRES_PASSWORD: ortxcore
      POSTGRES_DB: ortxcore
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ortxcore -d ortxcore"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
