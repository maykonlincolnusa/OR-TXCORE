[project]
name = "or-txcore"
version = "0.1.0"
description = "Simulated payment and fraud intelligence engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2", "structlog>=24.4,<26"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires an external PostgreSQL database"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
