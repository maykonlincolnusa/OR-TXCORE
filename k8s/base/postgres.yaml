apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-data, namespace: or-txcore}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 2Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: or-txcore}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      serviceAccountName: or-txcore
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: ortxcore}
            - {name: POSTGRES_PASSWORD, value: ortxcore-local-only}
            - {name: POSTGRES_DB, value: ortxcore}
          ports: [{containerPort: 5432}]
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          readinessProbe: {exec: {command: [sh, -c, pg_isready -U ortxcore]}, initialDelaySeconds: 5}
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: or-txcore}
spec: {selector: {app: postgres}, ports: [{port: 5432, targetPort: 5432}]}
