apiVersion: v1
kind: ServiceAccount
metadata:
  name: or-txcore
  namespace: or-txcore
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: read-own-config, namespace: or-txcore}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: or-txcore-read-own-config, namespace: or-txcore}
subjects: [{kind: ServiceAccount, name: or-txcore}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: read-own-config}
