---
apiVersion: v1
kind: Service
metadata: {name: fraudshield-ml, namespace: or-txcore}
spec: {selector: {app: fraudshield-ml}, ports: [{port: 8001, targetPort: 8001}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: fraudshield-ml, namespace: or-txcore}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: fraudshield-ml}
  minReplicas: 1
  maxReplicas: 3
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
---
