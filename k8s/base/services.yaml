apiVersion: apps/v1
kind: Deployment
metadata: {name: fraudshield-dashboard, namespace: or-txcore}
spec:
  replicas: 1
  selector: {matchLabels: {app: fraudshield-dashboard}}
  template:
    metadata: {labels: {app: fraudshield-dashboard}}
    spec:
      serviceAccountName: or-txcore
      containers:
        - name: dashboard
          image: or-txcore/fraudshield-dashboard:local
          ports: [{containerPort: 8501}]
          env: [{name: PAYMENT_CORE_URL, value: http://payment-core:8000}]
          securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 768Mi}}
          readinessProbe: {httpGet: {path: /_stcore/health, port: 8501}}
          livenessProbe: {httpGet: {path: /_stcore/health, port: 8501}}
---
