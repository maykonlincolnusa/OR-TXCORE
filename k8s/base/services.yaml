apiVersion: apps/v1
kind: Deployment
metadata: {name: payment-core, namespace: or-txcore}
spec:
  replicas: 1
  selector: {matchLabels: {app: payment-core}}
  template:
    metadata: {labels: {app: payment-core}}
    spec:
      serviceAccountName: or-txcore
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: payment-core
          image: or-txcore/payment-core:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: or-txcore-config}}, {secretRef: {name: or-txcore-dev-placeholder}}]
          env: [{name: DATABASE_URL, value: postgresql+psycopg://ortxcore:ortxcore-local-only@postgres:5432/ortxcore}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          startupProbe: {httpGet: {path: /healthz, port: 8000}, failureThreshold: 30, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /readyz, port: 8000}}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}}
---
apiVersion: v1
kind: Service
metadata: {name: payment-core, namespace: or-txcore}
spec: {selector: {app: payment-core}, ports: [{port: 8000, targetPort: 8000}]}
---
apiVersion: apps/v1
kind: Deployment
