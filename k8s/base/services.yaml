spec:
  replicas: 1
  selector: {matchLabels: {app: fraudshield-ml}}
  template:
    metadata: {labels: {app: fraudshield-ml}}
    spec:
      serviceAccountName: or-txcore
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: fraudshield-ml
          image: or-txcore/fraudshield-ml:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8001}]
          envFrom: [{configMapRef: {name: or-txcore-config}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
          readinessProbe: {httpGet: {path: /readyz, port: 8001}}
